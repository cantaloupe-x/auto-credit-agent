<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>车贷智审 · 汽车贷款审批中台</title>
<style>
:root{--ink:#10253f;--muted:#6c7d91;--line:#dfe7ef;--bg:#f4f7fb;--card:#fff;--blue:#1769e0;--teal:#0f9d8a;--amber:#e39a27;--red:#d65c5c;--nav:#10253f}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:240px;background:var(--nav);color:#dbe7f3;padding:24px 16px;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:700;color:#fff;margin:0 12px 28px}.brand small{display:block;font-weight:400;color:#8ba6c3;font-size:11px;margin-top:5px}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;color:#b7c8da;text-align:left;padding:12px 14px;border-radius:8px}.nav button.active,.nav button:hover{background:#1a3b63;color:#fff}.nav button span{margin-right:10px}.side .foot{margin-top:auto;padding:12px;color:#83a0bb;font-size:12px;border-top:1px solid #29415c}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top h1{font-size:20px;margin:0}.top .meta{color:var(--muted);font-size:12px}.user{display:flex;align-items:center;gap:10px}.avatar{width:32px;height:32px;border-radius:50%;background:#d8e8ff;color:var(--blue);display:grid;place-items:center;font-weight:700}.content{padding:28px 34px;max-width:1500px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}.metric{padding:18px 20px}.metric .label{color:var(--muted);font-size:12px}.metric .num{font-size:28px;font-weight:700;margin:10px 0 3px}.metric .hint{font-size:12px;color:var(--teal)}.layout{display:grid;grid-template-columns:1.12fr 1.88fr;gap:18px}.panel{overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:16px;margin:0}.panel-head .sub{color:var(--muted);font-size:12px}.filters{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line)}.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink)}.filters input{flex:1}.case{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.case:last-child{border-bottom:0}.case.selected{background:#eef5ff;border-left:3px solid var(--blue);padding-left:17px}.case h3{font-size:14px;margin:0 0 6px}.case p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.tag{display:inline-block;padding:3px 7px;border-radius:4px;font-size:11px;margin-left:6px}.tag.blue{background:#e8f1ff;color:var(--blue)}.tag.amber{background:#fff4de;color:#a56d12}.tag.red{background:#ffebeb;color:#b64a4a}.tag.green{background:#e3f7f2;color:#107c6e}.detail{padding:20px}.detail-title{display:flex;justify-content:space-between;align-items:flex-start}.detail-title h2{margin:0 0 6px;font-size:21px}.detail-title p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:6px;color:var(--ink)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{background:#fff2f2;color:#b64a4a;border-color:#f0caca}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:22px}.tabs button{border:0;background:transparent;padding:12px 2px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:600}.section{padding:20px 0;border-bottom:1px solid var(--line)}.section:last-child{border:0}.section h3{font-size:14px;margin:0 0 14px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fact{background:#f8fafc;border-radius:6px;padding:12px}.fact label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.fact b{font-size:14px}.riskbox{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.score{height:110px;border-radius:10px;background:#fff4de;display:grid;place-items:center;text-align:center}.score strong{font-size:34px;color:#b47718;display:block}.score span{font-size:11px;color:#a56d12}.reasons{display:flex;flex-wrap:wrap;gap:8px}.reason{padding:8px 10px;background:#fff6e9;color:#93621a;border-radius:5px;font-size:12px}.reason.ok{background:#e8f7f3;color:#157869}.reason.alert{background:#ffeded;color:#ad4e4e}.timeline{display:grid;gap:12px}.event{display:flex;gap:12px;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px}.event span{color:var(--muted);font-size:12px}.review{display:grid;grid-template-columns:1fr 1fr;gap:12px}.review label{font-size:12px;color:var(--muted);display:grid;gap:6px}.review select,.review textarea{border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff;color:var(--ink)}.review textarea{min-height:72px;resize:vertical;grid-column:1/-1}.notice{padding:10px 12px;background:#eef5ff;color:#426483;border-radius:6px;font-size:12px;line-height:1.6}.applicant{display:none}.applicant .panel{max-width:820px;margin:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{display:grid;gap:6px;color:var(--muted);font-size:12px}.formgrid input,.formgrid select{padding:10px;border:1px solid var(--line);border-radius:6px}.check{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:12px;margin:14px 0}.toast{position:fixed;right:26px;bottom:26px;background:#10253f;color:#fff;padding:12px 16px;border-radius:6px;display:none;box-shadow:0 5px 20px #112b4726}
@media(max-width:1000px){.side{width:190px}.content{padding:22px}.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{display:none}.top{padding:0 18px}.content{padding:16px}.metrics{gap:10px}.metric{padding:14px}.metric .num{font-size:22px}.facts,.formgrid{grid-template-columns:1fr}.riskbox{grid-template-columns:1fr}.detail-title{gap:14px;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">车贷智审<small>AutoCredit OS · 审批中台</small></div><nav class="nav"><button class="active" data-view="console"><span>▦</span>审批工作台</button><button data-view="applicant"><span>＋</span>申请人入口</button><button><span>◈</span>规则与模型</button><button><span>◷</span>审计记录</button></nav><div class="foot">模拟环境 · Sandbox<br>数据仅用于产品演示</div></aside>
<main class="main"><header class="top"><div><h1 id="pageTitle">审批工作台</h1><div class="meta">汽车贷款 · 中国大陆测试流程</div></div><div class="user"><span class="meta">今日已处理 12 件</span><div class="avatar">林</div></div></header>
<section class="content console"><div class="metrics"><div class="metric"><div class="label">待人工复核</div><div class="num">08</div><div class="hint">较昨日 +2</div></div><div class="metric"><div class="label">模型处理中</div><div class="num">03</div><div class="hint">平均用时 18 秒</div></div><div class="metric"><div class="label">今日通过率</div><div class="num">68%</div><div class="hint">在目标区间内</div></div><div class="metric"><div class="label">资料完整度</div><div class="num">92%</div><div class="hint">较上周 +5%</div></div></div>
<div class="layout"><div class="panel"><div class="panel-head"><div><h2>案件队列</h2><div class="sub">按处理状态筛选 · 共 16 件</div></div><button class="btn">导出</button></div><div class="filters"><input placeholder="搜索姓名 / 案件编号"/><select><option>全部状态</option><option>待人工复核</option><option>模型处理中</option><option>已完成</option></select></div><div id="caseList"></div></div>
<div class="panel" id="detailPanel"></div></div></section>
<section class="content applicant"><div class="panel"><div class="panel-head"><div><h2>汽车贷款申请</h2><div class="sub">模拟授权 · 测试数据 · 预计 3 分钟完成</div></div><span class="tag blue">步骤 1 / 2</span></div><div style="padding:24px"><div class="notice">我们将仅在本次审批范围内使用你授权的身份、收入、负债与车辆信息。你可以随时查看授权记录。</div><div class="section"><h3>申请人信息</h3><div class="formgrid"><label>姓名<input id="applicantName" value="陈思远"/></label><label>身份证号<input value="310***********4218"/></label><label>所在城市<select><option>上海市</option><option>北京市</option><option>广州市</option></select></label><label>职业类型<select><option>企业职员</option><option>个体经营</option><option>自由职业</option></select></label><label>月均收入（元）<input id="income" type="number" min="0" value="18500"/></label><label>现有月供（元）<input id="monthlyDebt" type="number" min="0" value="4200"/></label></div></div><div class="section"><h3>车辆与融资需求</h3><div class="formgrid"><label>车辆品牌 / 型号<input value="2024 款 凯美瑞 2.0G"/></label><label>车辆价格（元）<input id="vehiclePrice" type="number" min="1" value="189800"/></label><label>首付金额（元）<input id="downPayment" type="number" min="0" value="59800"/></label><label>申请贷款（元）<input id="loanAmount" type="number" min="1" value="130000"/></label><label>期数<select id="loanTerm"><option value="36">36 期</option><option value="24">24 期</option><option value="48">48 期</option></select></label><label>车辆来源<select><option>4S 店新车</option><option>二手车商</option></select></label></div></div><label class="check"><input type="checkbox" checked/> 我已阅读并同意《个人信息授权书》，授权车贷智审进行本次贷款审批所需的模拟核验。</label><button class="btn primary" onclick="submitApplication()">提交申请并开始核验</button><div id="assessmentResult"></div></div></div></section>
</main></div><div class="toast" id="toast"></div>
<script>
let cases = [];
let selected = 0;

function fmtMoney(value) {
  return "¥" + Number(value).toLocaleString("zh-CN");
}

function fmtTenure(years) {
  const totalMonths = Math.round(Number(years) * 12);
  const y = Math.floor(totalMonths / 12);
  const m = totalMonths % 12;
  return `${y} 年 ${m} 个月`;
}

function fmtDownRatio(downPayment, vehiclePrice) {
  return ((Number(downPayment) / Number(vehiclePrice)) * 100).toFixed(1) + "%";
}

function caseAmount(c) {
  return c.amount || (c.loan_amount != null ? fmtMoney(c.loan_amount) : "--");
}

function caseVehicle(c) {
  return c.vehicle || (c.vehicle_price != null ? "车辆 " + fmtMoney(c.vehicle_price) : "待补充");
}

function caseIncome(c) {
  return c.income != null && typeof c.income === "number" ? fmtMoney(c.income) + " / 月" : c.income || "--";
}

function caseDebt(c) {
  return c.monthly_debt != null ? fmtMoney(c.monthly_debt) + " / 月" : c.debt || "--";
}

function caseTenure(c) {
  return c.work_years != null ? fmtTenure(c.work_years) : c.tenure || "--";
}

function caseDown(c) {
  if (c.down) return c.down;
  if (c.down_payment != null && c.vehicle_price != null) return fmtDownRatio(c.down_payment, c.vehicle_price);
  return "--";
}

function caseScore(c) {
  return c.score ?? c.assessment?.score ?? null;
}

function caseStatus(c) {
  return c.status || "待人工复核";
}

function caseTag(c) {
  if (c.status === "通过") return "green";
  if (c.status === "拒绝") return "red";
  if (c.status === "补充资料") return "amber";
  if (c.status === "待风险评估") return "blue";
  if (c.tag) return c.tag;
  const score = caseScore(c);
  if (score == null) return "amber";
  if (score >= 80) return "green";
  if (score >= 60) return "amber";
  return "red";
}

function caseReasons(c) {
  return c.risk || c.assessment?.reasons || ["等待风险评估"];
}

function caseEvents(c) {
  if (c.events) return c.events;
  const events = [];
  if (c.created_at) {
    events.push([formatTime(c.created_at), "申请人完成资料授权"]);
  }
  if (c.assessment) {
    events.push([
      formatTime(c.assessment.assessed_at),
      `模型完成风险评估 · ${c.assessment.model_version || "rule-v1.0"}`
    ]);
  }
  if (c.decision) {
    events.push([
      "--",
      `人工复核：${c.decision.decision} · ${c.decision.operator || "reviewer-001"}`
    ]);
  }
  return events.length ? events : [["--", "案件已载入队列"]];
}

function formatTime(value) {
  if (!value) return "--";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value.slice(11, 16) || "--";
  return date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
}

async function loadCases(keepId) {
  try {
    const response = await fetch("/api/applications");

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const previousId = keepId ?? cases[selected]?.id;
    cases = await response.json();
    renderList();

    if (cases.length > 0) {
      const nextIndex = previousId ? cases.findIndex(item => item.id === previousId) : 0;
      selected = nextIndex >= 0 ? nextIndex : 0;
      renderDetail();
    } else {
      selected = 0;
      document.getElementById("detailPanel").innerHTML = "";
    }
  } catch (error) {
    showToast("案件加载失败，请稍后重试");
    console.error(error);
  }
}

function renderList() {
  document.getElementById("caseList").innerHTML = cases.map((c, i) => {
    const score = caseScore(c);
    const tag = caseTag(c);
    return `<div class="case ${i === selected ? "selected" : ""}" onclick="selectCase(${i})"><div><h3>${c.name}<span class="tag ${tag}">${caseStatus(c)}</span></h3><p>${c.id}<br>${caseVehicle(c)} · 申请 ${caseAmount(c)}</p></div><b style="color:${score && score < 60 ? "var(--red)" : "var(--ink)"}">${score ?? "--"}<small style="font-size:10px;color:var(--muted)"> 分</small></b></div>`;
  }).join("");
}

function selectCase(i) {
  selected = i;
  renderList();
  renderDetail();
}

function renderDetail() {
  const c = cases[selected];
  if (!c) return;

  const score = caseScore(c);
  const tag = caseTag(c);
  const reasons = caseReasons(c);
  const recommendation = c.assessment?.recommendation || (score >= 70 ? "建议通过，进入人工确认" : "建议谨慎，需补充核验后决定");
  const modelVersion = c.assessment?.model_version || "rule-v1.0";

  const assessAction = c.status === "待风险评估"
    ? `<button class="btn primary" onclick="runAssessment()">开始风险评估</button>`
    : ["通过", "拒绝"].includes(c.status)
      ? ""
      : `<button class="btn primary" onclick="approve()">保存人工结论</button>`;

  document.getElementById("detailPanel").innerHTML = `<div class="detail"><div class="detail-title"><div><h2>${c.name} <span class="tag ${tag}">${caseStatus(c)}</span></h2><p>${c.id} · 创建 ${c.created_at ? c.created_at.replace("T", " ").slice(0, 16) : "--"}</p></div><div class="actions"><button class="btn">补充资料</button>${assessAction}</div></div><div class="tabs"><button class="active">资信档案</button><button>原始资料</button><button>审计记录</button></div><div class="section"><h3>核心资信摘要</h3><div class="facts"><div class="fact"><label>月均收入</label><b>${caseIncome(c)}</b></div><div class="fact"><label>现有月供</label><b>${caseDebt(c)}</b></div><div class="fact"><label>当前单位任职</label><b>${caseTenure(c)}</b></div><div class="fact"><label>首付比例</label><b>${caseDown(c)}</b></div><div class="fact"><label>申请金额</label><b>${caseAmount(c)}</b></div><div class="fact"><label>资料完整度</label><b>100%</b></div></div></div><div class="section"><h3>模型判断与风险依据</h3><div class="riskbox"><div class="score"><div><strong>${score ?? "--"}</strong><span>${c.assessment?.level || (score ? "中低风险" : "计算中")}</span></div></div><div><div class="notice">模型建议：${recommendation}。模型版本 ${modelVersion}，仅供审批人员参考。</div><div class="reasons" style="margin-top:10px">${reasons.map((r, j) => `<span class="reason ${j === 1 && score != null && score < 70 ? "alert" : j === 0 && score != null && score >= 70 ? "ok" : ""}">${r}</span>`).join("")}</div></div></div></div><div class="section"><h3>人工复核</h3><div class="review"><label>复核结论<select id="decision"><option ${c.decision?.decision === "通过" ? "selected" : ""}>通过</option><option ${c.decision?.decision === "补充资料" ? "selected" : ""}>补充资料</option><option ${c.decision?.decision === "拒绝" ? "selected" : ""}>拒绝</option></select></label><label>风险等级<select id="riskLevel"><option ${c.decision?.risk_level === "中低风险" ? "selected" : ""}>中低风险</option><option ${c.decision?.risk_level === "中风险" ? "selected" : ""}>中风险</option><option ${c.decision?.risk_level === "高风险" ? "selected" : ""}>高风险</option></select></label><label style="grid-column:1/-1">审批意见<textarea id="comment">${c.decision?.comment || "已核对收入、首付与车辆信息，资料一致，建议按模型结论处理。"}</textarea></label></div></div><div class="section"><h3>处理记录</h3><div class="timeline">${caseEvents(c).map(e => `<div class="event"><i class="dot"></i><div><b>${e[1]}</b><br><span>${e[0]} · 林晓雯</span></div></div>`).join("")}</div></div></div>`;
}

async function runAssessment() {
  const current = cases[selected];
  if (!current) return;

  try {
    const response = await fetch(`/api/applications/${current.id}/assess`, {
      method: "POST"
    });

    if (!response.ok) {
      const message = await response.text();
      throw new Error(message);
    }

    showToast("风险评估已完成");
    await loadCases(current.id);
  } catch (error) {
    showToast("评估失败，请稍后重试");
    console.error(error);
  }
}

async function approve() {
  const current = cases[selected];
  if (!current) return;

  const response = await fetch(
    `/api/applications/${current.id}/decision`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        decision: document.querySelector("#decision").value,
        risk_level: document.querySelector("#riskLevel").value,
        comment: document.querySelector("#comment").value,
        operator: "reviewer-001"
      })
    }
  );

  if (!response.ok) {
    showToast("审批结果保存失败");
    return;
  }

  showToast("审批结果已保存");
  await loadCases(current.id);
}

async function submitApplication() {
  const response = await fetch("/api/applications", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: document.querySelector("#applicantName").value.trim(),
      income: Number(document.querySelector("#income").value),
      monthly_debt: Number(document.querySelector("#monthlyDebt").value),
      vehicle_price: Number(document.querySelector("#vehiclePrice").value),
      down_payment: Number(document.querySelector("#downPayment").value),
      loan_amount: Number(document.querySelector("#loanAmount").value),
      loan_term: Number(document.querySelector("#loanTerm").value),
      work_years: 3,
      recent_overdue: false
    })
  });

  if (!response.ok) {
    showToast("申请提交失败");
    return;
  }

  showToast("申请已进入审批队列");
  await loadCases();
}

function showAssessment(assessment) {
  const box = document.getElementById("assessmentResult");
  box.innerHTML = `<div class="section"><h3>风险评估结果</h3><div class="riskbox"><div class="score"><div><strong>${assessment.score}</strong><span>${assessment.level}</span></div></div><div><div class="notice">模型建议：${assessment.recommendation}。模型版本 ${assessment.model_version}。</div><div class="reasons" style="margin-top:10px">${assessment.reasons.map(r => `<span class="reason">${r}</span>`).join("")}</div></div></div></div>`;
}

function showToast(t) {
  const el = document.getElementById("toast");
  el.textContent = t;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2600);
}

document.querySelectorAll(".nav button[data-view]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  const v = b.dataset.view;
  document.querySelector(".console").style.display = v === "console" ? "block" : "none";
  document.querySelector(".applicant").style.display = v === "applicant" ? "block" : "none";
  document.getElementById("pageTitle").textContent = v === "console" ? "审批工作台" : "申请人入口";
});

loadCases();
</script></body></html>
