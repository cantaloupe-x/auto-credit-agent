<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>车贷智审 · 汽车贷款审批中台</title>
  <style>
    :root{--ink:#10253f;--muted:#6c7d91;--line:#dfe7ef;--bg:#f4f7fb;--card:#fff;--blue:#1769e0;--teal:#0f9d8a;--amber:#e39a27;--red:#d65c5c;--nav:#10253f}
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:240px;background:var(--nav);color:#dbe7f3;padding:24px 16px;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:700;color:#fff;margin:0 12px 28px}.brand small{display:block;font-weight:400;color:#8ba6c3;font-size:11px;margin-top:5px}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;color:#b7c8da;text-align:left;padding:12px 14px;border-radius:8px}.nav button.active,.nav button:hover:not(:disabled){background:#1a3b63;color:#fff}.nav button:disabled{cursor:default;opacity:.58}.nav button span{margin-right:10px}.nav button small{float:right;font-size:10px}.side .foot{margin-top:auto;padding:12px;color:#83a0bb;font-size:12px;border-top:1px solid #29415c}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top h1{font-size:20px;margin:0}.top .meta{color:var(--muted);font-size:12px}.user{display:flex;align-items:center;gap:10px}.avatar{width:32px;height:32px;border-radius:50%;background:#d8e8ff;color:var(--blue);display:grid;place-items:center;font-weight:700}.content{padding:28px 34px;max-width:1500px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}.metric{padding:18px 20px}.metric .label{color:var(--muted);font-size:12px}.metric .num{font-size:28px;font-weight:700;margin:10px 0 3px}.metric .hint{font-size:12px;color:var(--teal)}.layout{display:grid;grid-template-columns:1.12fr 1.88fr;gap:18px}.panel{overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:16px;margin:0}.panel-head .sub{color:var(--muted);font-size:12px}.filters{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line)}.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink)}.filters input{flex:1}.case{padding:16px 20px;border:0;border-bottom:1px solid var(--line);background:#fff;width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left}.case:hover,.case.selected{background:#eef5ff}.case.selected{border-left:3px solid var(--blue);padding-left:17px}.case h3{font-size:14px;margin:0 0 6px}.case p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.tag{display:inline-block;padding:3px 7px;border-radius:4px;font-size:11px;margin-left:6px}.tag.blue{background:#e8f1ff;color:var(--blue)}.tag.amber{background:#fff4de;color:#a56d12}.tag.red{background:#ffebeb;color:#b64a4a}.tag.green{background:#e3f7f2;color:#107c6e}.detail{padding:20px}.detail-title{display:flex;justify-content:space-between;align-items:flex-start}.detail-title h2{margin:0 0 6px;font-size:21px}.detail-title p{margin:0;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:6px;color:var(--ink)}.btn:hover{border-color:#aab8c7}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{cursor:wait;opacity:.65}.section{padding:20px 0;border-bottom:1px solid var(--line)}.section:last-child{border:0}.section h3{font-size:14px;margin:0 0 14px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fact{background:#f8fafc;border-radius:6px;padding:12px}.fact label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.fact b{font-size:14px}.riskbox{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.score{height:110px;border-radius:10px;background:#fff4de;display:grid;place-items:center;text-align:center}.score strong{font-size:34px;color:#b47718;display:block}.score span{font-size:11px;color:#a56d12}.reasons{display:flex;flex-wrap:wrap;gap:8px}.reason{padding:8px 10px;background:#fff6e9;color:#93621a;border-radius:5px;font-size:12px}.timeline{display:grid;gap:12px}.event{display:flex;gap:12px;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px;flex:0 0 auto}.event span{color:var(--muted);font-size:12px}.review{display:grid;grid-template-columns:1fr 1fr;gap:12px}.review label,.formgrid label{font-size:12px;color:var(--muted);display:grid;gap:6px}.review select,.review input,.review textarea,.formgrid input,.formgrid select{border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff;color:var(--ink)}.review textarea{min-height:72px;resize:vertical;grid-column:1/-1}.notice{padding:10px 12px;background:#eef5ff;color:#426483;border-radius:6px;font-size:12px;line-height:1.6}.applicant{display:none}.applicant .panel{max-width:900px;margin:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.check{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:12px;margin:14px 0}.toast{position:fixed;right:26px;bottom:26px;background:#10253f;color:#fff;padding:12px 16px;border-radius:6px;display:none;box-shadow:0 5px 20px #112b4726;max-width:420px}.toast.error{background:#a83f3f}.empty{padding:30px 20px;text-align:center;color:var(--muted)}
    @media(max-width:1000px){.side{width:190px}.content{padding:22px}.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){.side{display:none}.top{padding:0 18px}.content{padding:16px}.metrics{gap:10px}.metric{padding:14px}.metric .num{font-size:22px}.facts,.formgrid,.review{grid-template-columns:1fr}.riskbox{grid-template-columns:1fr}.detail-title{gap:14px;flex-direction:column}.filters{flex-direction:column}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">车贷智审<small>AutoCredit OS · 审批中台</small></div>
      <nav class="nav">
        <button class="active" data-view="console"><span>▦</span>审批工作台</button>
        <button data-view="applicant"><span>＋</span>申请人入口</button>
        <button disabled><span>◈</span>规则与模型<small>随案件展示</small></button>
        <button disabled><span>◷</span>审计记录<small>随案件展示</small></button>
      </nav>
      <div class="foot">模拟环境 · Sandbox<br>数据仅用于产品演示</div>
    </aside>
    <main class="main">
      <header class="top">
        <div><h1 id="pageTitle">审批工作台</h1><div class="meta">汽车贷款 · 中国大陆测试流程</div></div>
        <div class="user"><span class="meta" id="serviceStatus">正在连接后端</span><div class="avatar">林</div></div>
      </header>

      <section class="content console">
        <div class="metrics">
          <div class="metric"><div class="label">全部案件</div><div class="num" id="totalMetric">--</div><div class="hint">SQLite 实时数据</div></div>
          <div class="metric"><div class="label">待人工复核</div><div class="num" id="pendingMetric">--</div><div class="hint">需要审批人员处理</div></div>
          <div class="metric"><div class="label">已通过</div><div class="num" id="approvedMetric">--</div><div class="hint">人工最终结论</div></div>
          <div class="metric"><div class="label">待补充资料</div><div class="num" id="infoMetric">--</div><div class="hint">等待申请人补充</div></div>
        </div>
        <div class="layout">
          <div class="panel">
            <div class="panel-head"><div><h2>案件队列</h2><div class="sub" id="caseCount">正在读取案件</div></div><button class="btn" id="exportButton">导出</button></div>
            <div class="filters"><input id="searchInput" placeholder="搜索姓名 / 案件编号"><select id="statusFilter"><option value="">全部状态</option><option value="pending_review">待人工复核</option><option value="needs_more_info">补充资料</option><option value="approved">已通过</option><option value="rejected">已拒绝</option></select></div>
            <div id="caseList"><div class="empty">正在加载案件…</div></div>
          </div>
          <div class="panel" id="detailPanel"><div class="empty">请选择一个案件</div></div>
        </div>
      </section>

      <section class="content applicant">
        <div class="panel">
          <div class="panel-head"><div><h2>汽车贷款申请</h2><div class="sub">模拟授权 · 测试数据 · 提交后进入企业审批队列</div></div><span class="tag blue">完整申请</span></div>
          <form id="applicationForm" style="padding:24px">
            <div class="notice">本 Demo 仅保存合成测试数据。请勿填写真实身份证号、银行流水或其他敏感信息。</div>
            <div class="section"><h3>申请人信息</h3><div class="formgrid">
              <label>姓名<input id="name" value="测试申请人" required></label>
              <label>测试身份标识<input id="idNumber" value="TEST-ID-001"></label>
              <label>所在城市<select id="city"><option>上海市</option><option>北京市</option><option>广州市</option></select></label>
              <label>职业类型<select id="occupation"><option>企业职员</option><option>个体经营</option><option>自由职业</option></select></label>
              <label>月均收入（元）<input id="income" type="number" min="0" value="18500" required></label>
              <label>现有月供（元）<input id="monthlyDebt" type="number" min="0" value="4200" required></label>
              <label>当前任职年限<input id="workYears" type="number" min="0" step="0.1" value="3.7" required></label>
              <label>近 6 个月逾期<select id="recentOverdue"><option value="false">无</option><option value="true">有</option></select></label>
            </div></div>
            <div class="section"><h3>车辆与融资需求</h3><div class="formgrid">
              <label>车辆品牌 / 型号<input id="vehicleModel" value="2024 款 凯美瑞 2.0G" required></label>
              <label>车辆价格（元）<input id="vehiclePrice" type="number" min="1" value="189800" required></label>
              <label>首付金额（元）<input id="downPayment" type="number" min="0" value="59800" required></label>
              <label>申请贷款（元）<input id="loanAmount" type="number" min="1" value="130000" required></label>
              <label>期数<select id="loanTerm"><option value="36">36 期</option><option value="24">24 期</option><option value="48">48 期</option></select></label>
              <label>车辆来源<select id="vehicleSource"><option>4S 店新车</option><option>二手车商</option></select></label>
            </div></div>
            <label class="check"><input id="authorized" type="checkbox" checked> 我已阅读并同意模拟资料使用说明，授权本次测试审批。</label>
            <button class="btn primary" id="submitApplication" type="submit">提交申请并开始评估</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const state = {cases: [], selectedId: null, audit: []};
    const statusInfo = {
      pending_review: {label: '待人工复核', tag: 'amber'},
      needs_more_info: {label: '补充资料', tag: 'amber'},
      approved: {label: '已完成 · 通过', tag: 'green'},
      rejected: {label: '已完成 · 拒绝', tag: 'red'}
    };

    async function request(path, options = {}) {
      const response = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...options});
      const body = await response.json();
      if (!response.ok) {
        const detail = Array.isArray(body.detail) ? body.detail.map(item => item.msg.replace(/^Value error, /, '')).join('；') : body.detail;
        throw new Error(detail || `请求失败（${response.status}）`);
      }
      return body;
    }

    async function loadCases(preferredId = null) {
      try {
        state.cases = await request('/api/applications');
        document.getElementById('serviceStatus').textContent = '后端与数据库已连接';
        renderMetrics();
        if (preferredId) state.selectedId = preferredId;
        if (!state.cases.some(item => item.id === state.selectedId)) state.selectedId = state.cases[0]?.id || null;
        renderList();
        if (state.selectedId) await selectCase(state.selectedId);
      } catch (error) {
        document.getElementById('serviceStatus').textContent = '后端连接失败';
        document.getElementById('caseList').innerHTML = '<div class="empty">无法读取案件，请确认后端已启动。</div>';
        showToast(error.message, true);
      }
    }

    function renderMetrics() {
      document.getElementById('totalMetric').textContent = state.cases.length;
      document.getElementById('pendingMetric').textContent = state.cases.filter(item => item.status === 'pending_review').length;
      document.getElementById('approvedMetric').textContent = state.cases.filter(item => item.status === 'approved').length;
      document.getElementById('infoMetric').textContent = state.cases.filter(item => item.status === 'needs_more_info').length;
    }

    function filteredCases() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;
      return state.cases.filter(item => {
        const matchesQuery = !query || item.name.toLowerCase().includes(query) || item.id.toLowerCase().includes(query);
        return matchesQuery && (!status || item.status === status);
      });
    }

    function renderList() {
      const items = filteredCases();
      document.getElementById('caseCount').textContent = `当前显示 ${items.length} / ${state.cases.length} 件`;
      document.getElementById('caseList').innerHTML = items.length ? items.map(item => {
        const status = statusInfo[item.status] || {label: item.status, tag: 'blue'};
        return `<button class="case ${item.id === state.selectedId ? 'selected' : ''}" onclick="selectCase('${item.id}')"><div><h3>${escapeHtml(item.name)}<span class="tag ${status.tag}">${escapeHtml(status.label)}</span></h3><p>${escapeHtml(item.id)}<br>${escapeHtml(item.vehicle_model || '未填写车辆')} · 申请 ${formatMoney(item.loan_amount)}</p></div><b>${item.score}<small style="font-size:10px;color:var(--muted)"> 分</small></b></button>`;
      }).join('') : '<div class="empty">没有符合条件的案件</div>';
    }

    async function selectCase(applicationId) {
      state.selectedId = applicationId;
      renderList();
      document.getElementById('detailPanel').innerHTML = '<div class="empty">正在读取案件详情…</div>';
      try {
        const [application, events] = await Promise.all([
          request(`/api/applications/${applicationId}`),
          request(`/api/applications/${applicationId}/audit`)
        ]);
        const index = state.cases.findIndex(item => item.id === applicationId);
        if (index >= 0) state.cases[index] = application;
        renderMetrics();
        renderList();
        renderDetail(application, events);
      } catch (error) {
        document.getElementById('detailPanel').innerHTML = '<div class="empty">案件详情读取失败</div>';
        showToast(error.message, true);
      }
    }

    function renderDetail(item, events) {
      const status = statusInfo[item.status] || {label: item.status, tag: 'blue'};
      const reviewDecision = item.review_decision || 'approved';
      document.getElementById('detailPanel').innerHTML = `<div class="detail">
        <div class="detail-title"><div><h2>${escapeHtml(item.name)} <span class="tag ${status.tag}">${escapeHtml(status.label)}</span></h2><p>${escapeHtml(item.id)} · 更新于 ${formatTime(item.updated_at)}</p></div></div>
        <div class="section"><h3>核心资信摘要</h3><div class="facts">
          <div class="fact"><label>月均收入</label><b>${formatMoney(item.income)}</b></div><div class="fact"><label>现有月供</label><b>${formatMoney(item.monthly_debt)}</b></div><div class="fact"><label>当前单位任职</label><b>${item.work_years} 年</b></div>
          <div class="fact"><label>首付比例</label><b>${(item.down_payment / item.vehicle_price * 100).toFixed(1)}%</b></div><div class="fact"><label>申请金额</label><b>${formatMoney(item.loan_amount)}</b></div><div class="fact"><label>车辆</label><b>${escapeHtml(item.vehicle_model || '未填写')}</b></div>
        </div></div>
        <div class="section"><h3>模型判断与风险依据</h3><div class="riskbox"><div class="score"><div><strong>${item.score}</strong><span>${escapeHtml(item.risk_level)}</span></div></div><div><div class="notice">模型建议：${escapeHtml(item.recommendation)}。模型版本 ${escapeHtml(item.model_version)}，仅供审批人员参考。</div><div class="reasons" style="margin-top:10px">${item.reasons.map(reason => `<span class="reason">${escapeHtml(reason)}</span>`).join('')}</div></div></div></div>
        <div class="section"><h3>人工复核</h3><div class="review"><label>复核结论<select id="reviewDecision"><option value="approved" ${reviewDecision === 'approved' ? 'selected' : ''}>通过</option><option value="needs_more_info" ${reviewDecision === 'needs_more_info' ? 'selected' : ''}>补充资料</option><option value="rejected" ${reviewDecision === 'rejected' ? 'selected' : ''}>拒绝</option></select></label><label>审批人员<input id="reviewer" value="${escapeHtml(item.reviewer || '林晓雯')}"></label><label style="grid-column:1/-1">审批意见<textarea id="reviewComment">${escapeHtml(item.review_comment || '')}</textarea></label></div><button class="btn primary" id="reviewButton" style="margin-top:12px" onclick="submitReview()">保存复核并留痕</button></div>
        <div class="section"><h3>处理记录</h3><div class="timeline">${events.map(renderEvent).join('')}</div></div>
      </div>`;
    }

    function renderEvent(event) {
      const labels = {application_submitted: '申请资料已提交', risk_assessed: '模型已完成风险评估', manual_reviewed: '审批人员已完成人工复核'};
      const detail = event.event_type === 'manual_reviewed' ? ` · ${escapeHtml(event.details.comment)}` : '';
      return `<div class="event"><i class="dot"></i><div><b>${labels[event.event_type] || escapeHtml(event.event_type)}${detail}</b><br><span>${formatTime(event.created_at)} · ${escapeHtml(event.actor)}</span></div></div>`;
    }

    async function submitReview() {
      const button = document.getElementById('reviewButton');
      const comment = document.getElementById('reviewComment').value.trim();
      if (!comment) return showToast('请填写审批意见', true);
      setBusy(button, true, '正在保存…');
      try {
        await request(`/api/applications/${state.selectedId}/review`, {method: 'PATCH', body: JSON.stringify({decision: document.getElementById('reviewDecision').value, comment, reviewer: document.getElementById('reviewer').value.trim() || '审批员'})});
        showToast('人工复核已保存并写入审计记录');
        await loadCases(state.selectedId);
      } catch (error) {
        showToast(error.message, true);
      } finally {
        setBusy(button, false, '保存复核并留痕');
      }
    }

    document.getElementById('applicationForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('submitApplication');
      setBusy(button, true, '正在评估并保存…');
      const payload = {
        name: value('name'), id_number: value('idNumber'), city: value('city'), occupation: value('occupation'),
        vehicle_model: value('vehicleModel'), vehicle_source: value('vehicleSource'), income: numberValue('income'),
        monthly_debt: numberValue('monthlyDebt'), vehicle_price: numberValue('vehiclePrice'), down_payment: numberValue('downPayment'),
        loan_amount: numberValue('loanAmount'), loan_term: numberValue('loanTerm'), work_years: numberValue('workYears'),
        recent_overdue: value('recentOverdue') === 'true', authorized: document.getElementById('authorized').checked
      };
      try {
        const created = await request('/api/applications', {method: 'POST', body: JSON.stringify(payload)});
        showToast(`申请已保存，风险评分 ${created.score} 分`);
        showView('console');
        await loadCases(created.id);
      } catch (error) {
        showToast(error.message, true);
      } finally {
        setBusy(button, false, '提交申请并开始评估');
      }
    });

    function exportCases() {
      const rows = [['案件编号','姓名','状态','风险分','申请金额'], ...filteredCases().map(item => [item.id,item.name,statusInfo[item.status]?.label || item.status,item.score,item.loan_amount])];
      const csv = '\ufeff' + rows.map(row => row.map(cell => `"${String(cell).replaceAll('"','""')}"`).join(',')).join('\n');
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
      link.download = 'auto-credit-cases.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function showView(view) {
      document.querySelectorAll('.nav button[data-view]').forEach(button => button.classList.toggle('active', button.dataset.view === view));
      document.querySelector('.console').style.display = view === 'console' ? 'block' : 'none';
      document.querySelector('.applicant').style.display = view === 'applicant' ? 'block' : 'none';
      document.getElementById('pageTitle').textContent = view === 'console' ? '审批工作台' : '申请人入口';
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast${isError ? ' error' : ''}`;
      toast.style.display = 'block';
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.style.display = 'none', 3200);
    }

    function setBusy(button, busy, label) {button.disabled = busy; button.textContent = label;}
    function value(id) {return document.getElementById(id).value.trim();}
    function numberValue(id) {return Number(document.getElementById(id).value);}
    function formatMoney(value) {return new Intl.NumberFormat('zh-CN', {style:'currency',currency:'CNY',maximumFractionDigits:0}).format(value);}
    function formatTime(value) {return new Date(value).toLocaleString('zh-CN', {hour12:false});}
    function escapeHtml(value) {return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[character]);}

    document.querySelectorAll('.nav button[data-view]').forEach(button => button.addEventListener('click', () => showView(button.dataset.view)));
    document.getElementById('searchInput').addEventListener('input', renderList);
    document.getElementById('statusFilter').addEventListener('change', renderList);
    document.getElementById('exportButton').addEventListener('click', exportCases);
    loadCases();
  </script>
