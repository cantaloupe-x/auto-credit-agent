services:
  - type: web
    name: auto-credit-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # 免费套餐不支持持久磁盘，要保住「重启后数据还在」就得用 starter
    healthCheckPath: /api/health
    envVars:
      - key: AUTO_CREDIT_DB
        value: /var/data/auto_credit.db
    disk:
      name: auto-credit-data
      mountPath: /var/data
      sizeGB: 1
